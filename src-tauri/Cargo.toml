[package]
name = "pq"
version = "1.9.1"
description = "pq - nerd terminal grid for AI coding agents"
authors = ["pq"]
edition = "2021"
default-run = "pq"

[lib]
name = "pq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
portable-pty = "0.8"
regex = "1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "6"
percent-encoding = "2"
thiserror = "2"
once_cell = "1"
local-ip-address = "0.6"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"