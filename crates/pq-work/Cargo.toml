[package]
name = "pq-work"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pq workbench binary (Phase 1 stub; future Tauri UI host)"

[[bin]]
name = "pq-work"
path = "src/main.rs"

[dependencies]
pq-core = { workspace = true }
portable-pty = { version = "0.9.0", optional = true }

[features]
default = []
# Optional ConPTY spike: `cargo run -p pq-work --features pty-spike -- --pty-spike`
pty-spike = ["dep:portable-pty"]