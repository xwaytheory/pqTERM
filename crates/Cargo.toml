[workspace]
resolver = "2"
members = [
    "pq-core",
    "pq-work",
    "pq-voice",
]
default-members = ["pq-work", "pq-voice"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["pq"]

[workspace.dependencies]
pq-core = { path = "pq-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
