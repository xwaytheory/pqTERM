[workspace]
resolver = "2"
members = [
    "pq-core",
    "pq-work",
    "pq-voice",
]
default-members = ["pq-work", "pq-voice"]

[workspace.package]
# Product version: keep in sync with Electron package.json (1.1.8).
# Crates inherit this; see pq-core::version for dual-track notes.
version = "1.3.12"
edition = "2021"
license = "MIT"
authors = ["pq"]

[workspace.dependencies]
pq-core = { path = "pq-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
